      body::after{
        content:""; position:fixed; inset:0; z-index:-1;
        background:
          radial-gradient(circle at 12% 20%, rgba(255,255,255,.30) 0 26px, transparent 27px),
          radial-gradient(circle at 88% 12%, rgba(255,255,255,.24) 0 18px, transparent 19px),
          radial-gradient(circle at 80% 82%, rgba(255,255,255,.18) 0 32px, transparent 33px),
          linear-gradient(180deg, var(--wash1), var(--wash2));
      }
      .wrap{ max-width:1060px; margin:0 auto; padding:14px 14px 26px; }
      header.top{
        display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
        margin-bottom:12px;
      }
      h1{ font-size:clamp(26px,4.5vw,38px); margin:0; letter-spacing:1px; }
      h1 .big{ color:var(--accent-deep); }
      .tagline{ width:100%; margin:-4px 0 0; font-size:15px; color:var(--muted); }
      .stats{ display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; align-items:stretch; }
      .chip{
        background:var(--chip); border:2px solid var(--panel-line); border-radius:14px;
        padding:6px 12px; min-width:86px; text-align:center;
      }
      .chip .lab{ font-size:12px; color:var(--muted); letter-spacing:2px; }
      .chip .val{ font-size:22px; line-height:1.15; }
      .chip.next{ min-width:76px; display:flex; flex-direction:column; align-items:center; }
      .chip.next canvas{ width:44px; height:44px; }
      .layout{ display:flex; gap:16px; align-items:flex-start; }
      .stage-col{ flex:1 1 auto; min-width:0; }
      .arena-frame{
        position:relative;
        background:linear-gradient(180deg, var(--ring), var(--ring-dark));
        border-radius:26px;
        padding:12px;
        box-shadow:0 14px 30px rgba(60,32,4,.28), inset 0 2px 0 rgba(255,255,255,.25);
      }
      .arena-inner{
        position:relative; border-radius:16px; overflow:hidden;
        background:var(--box-bg);
        box-shadow:inset 0 0 0 3px rgba(111,69,32,.35), inset 0 -18px 30px rgba(138,90,43,.12);
      }
      canvas#game{ display:block; width:100%; height:auto; touch-action:none; cursor:pointer; }
      .controls{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
      .btn{
        font-family:inherit; font-size:16px; color:var(--ink);
        background:var(--panel); border:2px solid var(--panel-line); border-radius:999px;
        padding:8px 16px; min-height:44px; cursor:pointer;
        box-shadow:0 3px 0 var(--panel-line);
      }
      .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--panel-line); }
      .btn.primary{ background:var(--accent); border-color:var(--accent-deep); color:#fff; box-shadow:0 3px 0 var(--accent-deep); }
      .btn.primary:active{ box-shadow:0 1px 0 var(--accent-deep); }
      .btn:disabled{ opacity:.45; cursor:not-allowed; }
      .hint{ font-size:13.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
      aside.side{
        flex:0 0 248px; width:248px;
        background:var(--panel); border:2px solid var(--panel-line); border-radius:20px;
        padding:14px 14px 10px;
      }
      aside.side h2{ margin:0 0 4px; font-size:19px; }
      aside.side p{ margin:0 0 10px; font-size:13px; color:var(--muted); line-height:1.5; }
      .evo-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
      .evo-list li{
        display:flex; align-items:center; gap:10px; padding:3px 8px 3px 4px;
        border-radius:12px; opacity:.48; filter:saturate(.4);
      }
      .evo-list li.got{ opacity:1; filter:none; background:var(--chip); }
      .evo-list li canvas{ width:40px; height:40px; flex:0 0 auto; }
      .evo-list .nm{ font-size:15.5px; }
      .evo-list .lv{ margin-left:auto; font-size:12px; color:var(--muted); }
      .evo-list li.seal .nm{ color:#3d7ea6; }
      .toast{
        position:absolute; left:50%; top:16%; transform:translate(-50%,-50%) scale(.8);
        background:rgba(51,36,26,.92); color:#ffe9c9; font-size:clamp(19px,4vw,27px);
        padding:10px 22px; border-radius:999px; pointer-events:none; opacity:0;
        transition:opacity .18s ease, transform .18s ease; white-space:nowrap; z-index:5;
      }
      .toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
      .overlay{
        position:absolute; inset:0; display:none; z-index:6;
        background:rgba(30,18,8,.55); backdrop-filter:blur(2px);
        align-items:center; justify-content:center; text-align:center; padding:20px;
      }
      .overlay.show{ display:flex; }
      .overlay .card{
        background:var(--panel); border-radius:22px; padding:26px 30px; max-width:320px; width:100%;
        border:3px solid var(--panel-line);
      }
      .overlay h3{ margin:0 0 6px; font-size:28px; }
      .overlay p{ margin:4px 0 14px; font-size:16px; color:var(--muted); }
      .overlay .final{ font-size:40px; color:var(--accent-deep); }
      @media (max-width:820px){
        .layout{ flex-direction:column; }
        aside.side{ flex:none; width:100%; }
        .evo-list{ flex-direction:row; flex-wrap:wrap; gap:4px; }
        .evo-list li{ flex:0 0 auto; padding:3px 8px 3px 3px; }
        .evo-list li canvas{ width:30px; height:30px; }
        .evo-list .lv{ display:none; }
        .stats{ margin-left:0; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>合成<span class="big">mj</span></h1>
        <div class="stats">
          <div class="chip"><div class="lab">分数</div><div class="val" id="score">0</div></div>
          <div class="chip"><div class="lab">本局最高</div><div class="val" id="best">0</div></div>
          <div class="chip next"><div class="lab">下一个</div><canvas id="nextCv" width="88" height="88"></canvas></div>
        </div>
        <p class="tagline">往擂台里丢头像，两只一样的碰到一起就合体变大——一级比一级大，合到最后还有限定款。小心别堆过红线！</p>
      </header>

      <div class="layout">
        <div class="stage-col">
          <div class="arena-frame" id="frame">
            <div class="arena-inner">
              <canvas id="game" width="440" height="600"></canvas>
              <div class="toast" id="toast"></div>
              <div class="overlay" id="overlay">
                <div class="card">
                  <h3>堆满啦！</h3>
                  <p>本局得分</p>
                  <div class="final" id="finalScore">0</div>
                  <p id="finalNote"></p>
                  <button class="btn primary" id="againBtn" type="button">再来一局</button>
                </div>
              </div>
            </div>
          </div>
          <div class="controls">
            <button class="btn primary" id="roarBtn" type="button">🦁 吼一嗓子（剩 <span id="roarLeft">3</span>）</button>
            <button class="btn" id="restartBtn" type="button">↺ 重新开始</button>
            <button class="btn" id="soundBtn" type="button">🔊 声音开</button>
          </div>
          <p class="hint">玩法：移动鼠标或手指瞄准，点一下（或按空格）把头像丢下去。两个同级头像相碰会合成高一级，级别越高个头越大、分越高。两个最高级相撞会直接爆炸，清掉一大片。堆过顶部红线并停留太久就结束。「吼一嗓子」能把全场震得跳起来，卡住时用它翻盘。</p>
        </div>

        <aside class="side">
          <h2>进化图鉴</h2>
          <p>同一张照片，越合越大，一共 11 个大小。图鉴会点亮你合到过的级别。</p>
          <ul class="evo-list" id="evoList"></ul>
        </aside>
      </div>
    </div>

      var RING_COLORS = ["#eecfa3","#eebd7f","#e59a45","#dd7f2e","#cd6524","#bf5520","#b04c1e","#a03f16","#f2b26b","#e0951c","#7e9cae"];
      function drawDog(c, lv, r, angle, pop){
        var L = LEVELS[lv];
        var s = r * (pop == null ? 1 : (0.55 + 0.45 * pop));
        c.save();
        c.rotate(angle || 0);
        // colored ring so levels stay distinguishable
        c.beginPath(); c.arc(0, 0, s * 1.045, 0, Math.PI * 2);
        c.fillStyle = RING_COLORS[lv] || L.ear; c.fill();
        // circular photo
        c.beginPath(); c.arc(0, 0, s, 0, Math.PI * 2); c.clip();
        if (faceReady){
          var d = s * 2.36;
          c.drawImage(faceImg, -d / 2, -d / 2 - s * 0.07, d, d);
        } else {
          c.fillStyle = L.fur; c.fillRect(-s, -s, s * 2, s * 2);
        }
        c.restore();
        // crown marker on the biggest level (大老谋)
        if (lv === 9){
          c.save(); c.rotate(angle || 0);
          c.fillStyle = "#ffcf3f"; c.strokeStyle = "#e0951c"; c.lineWidth = Math.max(1.2, s * 0.03);
          var cw = s * 0.62, ch = s * 0.32, cx = -cw / 2, cy = -s * 1.22;
          c.beginPath();
          c.moveTo(cx, cy + ch);
          c.lineTo(cx, cy); c.lineTo(cx + cw * 0.25, cy + ch * 0.55); c.lineTo(cx + cw * 0.5, cy);
          c.lineTo(cx + cw * 0.75, cy + ch * 0.55); c.lineTo(cx + cw, cy); c.lineTo(cx + cw, cy + ch);
          c.closePath(); c.fill(); c.stroke();
          c.restore();
        }
      }

      // ---------- evolution chart + next preview ----------
      var evoItems = [];
      var evoCtxs = [];
      (function buildChart(){
        var ul = document.getElementById("evoList");
        LEVELS.forEach(function(L, i){
          var li = document.createElement("li");
          if (L.seal) li.className = "seal";
          var c = document.createElement("canvas");
          c.width = 96; c.height = 96;
          var g = c.getContext("2d");
          g.translate(48, 48);
          drawDog(g, i, 34, 0, 1);
          evoCtxs.push(g);
          var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = L.name;
          var lv = document.createElement("span"); lv.className = "lv"; lv.textContent = "Lv." + (i + 1);
          li.appendChild(c); li.appendChild(nm); li.appendChild(lv);
          ul.appendChild(li);
          evoItems.push(li);
        });
      })();
      function drawNext(){
        var c = document.getElementById("nextCv");
        var g = c.getContext("2d");
        g.clearRect(0, 0, 88, 88);
        g.save(); g.translate(44, 44);
        drawDog(g, nextLevel, 30, 0, 1);
        g.restore();
      }
      function redrawStatics(){
        for (var i = 0; i < evoCtxs.length; i++){
          var g = evoCtxs[i];
          g.save();
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.clearRect(0, 0, 96, 96);
          g.restore();
          drawDog(g, i, 34, 0, 1);
        }
        drawNext();
      }
      function markGot(lv){
        if (lv > maxGot) maxGot = lv;
        for (var i = 0; i <= maxGot && i < evoItems.length; i++) evoItems[i].classList.add("got");
      }

      // ---------- audio ----------
      function beep(freq, dur, type, vol, when){
        if (!soundOn) return;
        try{
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var t = audioCtx.currentTime + (when || 0);
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(vol || 0.12, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t); o.stop(t + dur);
        }catch(e){}
      }
      function sndDrop(){ beep(300, 0.08, "triangle", 0.08); }
      function sndMerge(lv){ beep(380 + lv * 60, 0.12, "sine", 0.14); beep(560 + lv * 70, 0.16, "sine", 0.10, 0.05); }
      function sndBoom(){ beep(90, 0.4, "sawtooth", 0.16); beep(60, 0.5, "square", 0.10, 0.05); }
      function sndRoar(){ beep(160, 0.14, "sawtooth", 0.15); beep(120, 0.2, "sawtooth", 0.15, 0.13); }

      // ---------- helpers ----------
      function pickSpawn(){
        var tot = 0, i;
        for (i = 0; i < SPAWN_W.length; i++) tot += SPAWN_W[i];
        var x = Math.random() * tot;
        for (i = 0; i < SPAWN_W.length; i++){ x -= SPAWN_W[i]; if (x <= 0) return i; }
        return 0;
      }
      function toast(msg, ms){
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 1300);
      }
      function addScore(n, x, y){
        score += n;
        if (score > sessionBest) sessionBest = score;
        scoreEl.textContent = score;
        bestEl.textContent = sessionBest;
        if (x != null) floats.push({ x:x, y:y, txt:"+" + n, life:0.9, t:0 });
      }
      function burst(x, y, n, color){
        for (var i = 0; i < n; i++){
          var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 190;
          particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
            life:0.55 + Math.random()*0.3, t:0, r:2 + Math.random()*3.2, color:color });
        }
      }

      // ---------- game flow ----------
      function newBody(lv, x, y){
        return { id:idSeq++, lv:lv, x:x, y:y, vx:0, vy:0,
          r:LEVELS[lv].r, angle:(Math.random()-0.5)*0.2, age:0, cd:0.22, pop:0, dead:false };
      }
      function drop(){
        if (gameOver || dropCd > 0) return;
        var r = LEVELS[curLevel].r;
        var x = Math.max(WALL + r, Math.min(W - WALL - r, aimX));
        var b = newBody(curLevel, x, DROP_Y);
        bodies.push(b);
        started = true;
        dropCd = 0.55;
        curLevel = nextLevel;
        nextLevel = pickSpawn();
        drawNext();
        sndDrop();
      }
      function doMerge(a, b){
        var lv = a.lv, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
        a.dead = b.dead = true;
        if (lv >= 10){ // two seals explode
          var R = 175, cleared = 0;
          bodies.forEach(function(o){
            if (!o.dead && Math.hypot(o.x - x, o.y - y) < R + o.r){ o.dead = true; cleared++; }
          });
          var pts = 500 + cleared * 30;
          addScore(pts, x, y - 30);
          burst(x, y, 46, "#7fb3cc"); burst(x, y, 30, "#ffd166");
          shake = Math.max(shake, 13);
          toast("💥 海豹爆炸！+" + pts);
          sndBoom();
          return;
        }
        var nb = newBody(lv + 1, x, y);
        nb.vy = -60; nb.cd = 0.28;
        bodies.push(nb);
        var pts = (lv + 2) * (lv + 3) / 2 * 10;
        addScore(pts, x, y - nb.r);
        burst(x, y, 12 + lv * 2, "#ffb703");
        markGot(lv + 1);
        if (lv + 1 === 8) toast("🎉 合成老谋啦！");
        if (lv + 1 === 9) toast("👑 大老谋诞生！");
        if (lv + 1 === 10) toast("✨ 限定海豹出现！两只相撞会爆炸");
        sndMerge(lv + 1);
      }
      function endGame(){
        gameOver = true;
        document.getElementById("finalScore").textContent = score;
        document.getElementById("finalNote").textContent =
          maxGot >= 10 ? "你连限定海豹都合出来了，太强了！" :
          maxGot >= 8 ? "最高合到了「" + LEVELS[maxGot].name + "」，离海豹不远了！" :
          "最高合到了「" + LEVELS[maxGot].name + "」，再试试往老谋冲！";
        overlayEl.classList.add("show");
        sndBoom();
      }
      function restart(){
        bodies = []; particles = []; floats = [];
        score = 0; overflowT = 0; gameOver = false; started = false;
        roars = 3; maxGot = 0; dropCd = 0;
        scoreEl.textContent = "0";
        roarLeftEl.textContent = roars;
        roarBtn.disabled = false;
        evoItems.forEach(function(li){ li.classList.remove("got"); });
        curLevel = pickSpawn(); nextLevel = pickSpawn();
        drawNext();
        overlayEl.classList.remove("show");
      }

      // ---------- physics ----------
      function physics(dt){
        var i, j, b;
        for (i = 0; i < bodies.length; i++){
          b = bodies[i];
          b.age += dt; b.cd -= dt;
          if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / 0.16);
          b.vy += GRAV * dt;
          b.vx *= 0.999; 
          b.x += b.vx * dt; b.y += b.vy * dt;
          b.angle += (b.vx / Math.max(10, b.r)) * dt * 0.7;
          if (b.x - b.r < WALL){ b.x = WALL + b.r; b.vx = Math.abs(b.vx) * 0.35; }
          if (b.x + b.r > W - WALL){ b.x = W - WALL - b.r; b.vx = -Math.abs(b.vx) * 0.35; }
          if (b.y + b.r > FLOOR){
            b.y = FLOOR - b.r;
            if (b.vy > 60) b.vy = -b.vy * 0.22; else b.vy = 0;
            b.vx *= 0.90;
          }
          if (b.y - b.r < 4){ b.y = 4 + b.r; b.vy = Math.abs(b.vy) * 0.2; }
        }
        // pair collisions, a few relaxation passes
        for (var pass = 0; pass < 3; pass++){
          for (i = 0; i < bodies.length; i++){
            for (j = i + 1; j < bodies.length; j++){
              var a = bodies[i], c = bodies[j];
              if (a.dead || c.dead) continue;
              var dx = c.x - a.x, dy = c.y - a.y;
              var rr = a.r + c.r;
              var d2 = dx*dx + dy*dy;
              if (d2 >= rr * rr || d2 === 0) continue;
              if (a.lv === c.lv && a.cd <= 0 && c.cd <= 0 && pass === 0){
                doMerge(a, c);
                continue;
              }
              var d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
              var overlap = rr - d;
              var ma = a.r * a.r, mc = c.r * c.r, mt = ma + mc;
              a.x -= nx * overlap * (mc / mt); a.y -= ny * overlap * (mc / mt);
              c.x += nx * overlap * (ma / mt); c.y += ny * overlap * (ma / mt);
              var rvx = c.vx - a.vx, rvy = c.vy - a.vy;
              var vn = rvx * nx + rvy * ny;
              if (vn < 0){
                var e = 0.08, imp = -(1 + e) * vn;
                a.vx -= nx * imp * (mc / mt); a.vy -= ny * imp * (mc / mt);
                c.vx += nx * imp * (ma / mt); c.vy += ny * imp * (ma / mt);
                // tangential friction
                var tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
                var f = vt * 0.06;
                a.vx -= tx * f * (mc / mt); a.vy -= ty * f * (mc / mt);
                c.vx += tx * f * (ma / mt); c.vy += ty * f * (ma / mt);
              }
            }
          }
        }
        bodies = bodies.filter(function(o){ return !o.dead; });
      }

      // ---------- render ----------
      function render(){
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        if (shake > 0.2){
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
          shake *= 0.86;
        }
        // floor planks
        ctx.fillStyle = "rgba(138,90,43,0.20)";
        ctx.fillRect(WALL, FLOOR, W - WALL * 2, 6);
        // danger line
        var warn = overflowT > 0.05;
        ctx.strokeStyle = warn ? "rgba(230,57,70,0.95)" : "rgba(230,57,70,0.4)";
        ctx.lineWidth = warn ? 3 : 2;
        ctx.setLineDash([9, 7]);
        ctx.beginPath(); ctx.moveTo(WALL, LINE_Y); ctx.lineTo(W - WALL, LINE_Y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = warn ? "#e63946" : "rgba(230,57,70,0.55)";
        ctx.font = "13px sans-serif";
        ctx.fillText("危险线", WALL + 4, LINE_Y - 6);
        // aim guide + dropper dog
        if (!gameOver){
          var r = LEVELS[curLevel].r;
          var ax = Math.max(WALL + r, Math.min(W - WALL - r, aimX));
          ctx.strokeStyle = "rgba(120,90,60,0.35)";
          ctx.setLineDash([4, 6]);
          ctx.beginPath(); ctx.moveTo(ax, DROP_Y + r + 4); ctx.lineTo(ax, FLOOR); ctx.stroke();
          ctx.setLineDash([]);
          ctx.save(); ctx.translate(ax, DROP_Y);
          ctx.globalAlpha = dropCd > 0 ? 0.35 : 0.92;
          drawDog(ctx, curLevel, r, 0, 1);
          ctx.restore();
        }
        // bodies
        for (var i = 0; i < bodies.length; i++){
          var b = bodies[i];
          ctx.save(); ctx.translate(b.x, b.y);
          var ease = 1 - Math.pow(1 - b.pop, 3);
          drawDog(ctx, b.lv, b.r, b.angle, ease);
          ctx.restore();
        }
        // particles
        for (var p = 0; p < particles.length; p++){
          var pt = particles[p];
          ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
          ctx.fillStyle = pt.color;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // floating scores
        ctx.font = "bold 19px 'ZCOOL KuaiLe', sans-serif";
        ctx.textAlign = "center";
        for (var f = 0; f < floats.length; f++){
          var fl = floats[f];
          ctx.globalAlpha = Math.max(0, 1 - fl.t / fl.life);
          ctx.fillStyle = "#e85d04";
          ctx.fillText(fl.txt, fl.x, fl.y - fl.t * 46);
        }
        ctx.globalAlpha = 1; ctx.textAlign = "left";
        ctx.restore();
      }

      // ---------- main loop ----------
      var last = performance.now(), acc = 0;
      function frame(now){
        requestAnimationFrame(frame);
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (!gameOver){
          if (dropCd > 0) dropCd -= dt;
          acc += dt;
          var step = 1 / 120;
          var n = 0;
          while (acc >= step && n < 8){ physics(step); acc -= step; n++; }
          // overflow check
          var over = false;
          for (var i = 0; i < bodies.length; i++){
            var b = bodies[i];
            if (b.age > 1.1 && b.y - b.r < LINE_Y && Math.abs(b.vy) < 260){ over = true; break; }
          }
          if (started && over){
            overflowT += dt;
            if (overflowT > 1.4) endGame();
          } else {
            overflowT = Math.max(0, overflowT - dt * 2);
          }
        }
        // particles & floats
        for (var p = particles.length - 1; p >= 0; p--){
          var pt = particles[p];
          pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 500 * dt;
          if (pt.t >= pt.life) particles.splice(p, 1);
        }
        for (var f = floats.length - 1; f >= 0; f--){
          floats[f].t += dt;
          if (floats[f].t >= floats[f].life) floats.splice(f, 1);
        }
        render();
      }

      // ---------- input ----------
      function toLogical(e){
        var rect = cv.getBoundingClientRect();
        return (e.clientX - rect.left) / rect.width * W;
      }
      cv.addEventListener("pointermove", function(e){ aimX = toLogical(e); });
      cv.addEventListener("pointerdown", function(e){
        e.preventDefault();
        aimX = toLogical(e);
        drop();
      });
      window.addEventListener("keydown", function(e){
        if (e.code === "ArrowLeft"){ aimX -= 18; e.preventDefault(); }
        else if (e.code === "ArrowRight"){ aimX += 18; e.preventDefault(); }
        else if (e.code === "Space"){ drop(); e.preventDefault(); }
      });
      document.getElementById("restartBtn").addEventListener("click", restart);
      document.getElementById("againBtn").addEventListener("click", restart);
      document.getElementById("soundBtn").addEventListener("click", function(){
        soundOn = !soundOn;
        this.textContent = soundOn ? "🔊 声音开" : "🔇 声音关";
        if (soundOn) beep(660, 0.08, "sine", 0.1);
      });
      roarBtn.addEventListener("click", function(){
        if (gameOver || roars <= 0) return;
        roars--;
        roarLeftEl.textContent = roars;
        if (roars <= 0) roarBtn.disabled = true;
        shake = 14;
        bodies.forEach(function(b){
          b.vy = -(260 + Math.random() * 320);
          b.vx += (Math.random() - 0.5) * 260;
        });
        toast("🦁 老谋吼一嗓子！");
        sndRoar();
      });

      restart();
      requestAnimationFrame(frame);
    })();
    </script>
  </body>
</html>
